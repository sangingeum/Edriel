# ============================================================================
# Edriel runtime configuration
# ============================================================================
#
# Auto-discovery uses UDP multicast. The group address, port, heartbeat send
# interval, and participant aliveness timeout are read here at startup and fed
# into the multicast-send, local-bind, and timer endpoints.
#
# All keys are optional. Each value is validated strictly per-key; when a
# value is missing, malformed, or out of range, the library silently falls
# back to the built-in default rather than aborting, so a bad or missing
# config.yml can never crash a node.

# UDP port for auto-discovery multicast send/receive.
#   - must be an integer in the valid UDP port range 1..65535
#   - non-numeric, 0, or out-of-range -> falls back to 30002
port: 30002

# IPv4 multicast group address the node joins for discovery.
#   - must parse as a valid IPv4 multicast address (first octet 224..239)
#   - unparseable or non-multicast -> falls back to 239.255.0.1
multicast_ip: 239.255.0.1

# Discovery heartbeat send interval, in whole seconds.
#   - must be a positive integer, capped at 86400 (24h) to reject pathological
#   - non-numeric, 0, or above the cap -> falls back to 2
discovery_period_seconds: 2

# Participant aliveness timeout, in whole seconds: a peer whose last heartbeat
# is older than this is dropped by the cleanup pass.
#   - must be a positive integer, capped at 86400 (24h) to reject pathological
#   - non-numeric, 0, or above the cap -> falls back to 10
#   - the cleanup pass runs at timeout/2 (so a 10s timeout cleans every 5s)
participant_timeout_seconds: 10

# ----------------------------------------------------------------------------
# Reliable path (ADR-0002): the gRPC ParticipantStreamService unicast plane.
# Endpoints are piggybacked on the multicast heartbeat; this node both serves
# its own grpc_port and, as a subscriber, dials publishers' endpoints.
# ----------------------------------------------------------------------------

# TCP listener port the node serves its reliable gRPC service on (the port
# advertised on every advertised Endpoint candidate).
#   - must be an integer in the valid port range 1..65535
#   - non-numeric, 0, or out-of-range -> falls back to 4000
grpc_port: 4000

# Optional unicast addresses to advertise in addition to auto-discovered
# interfaces (multi-homed / cross-subnet / multicast-blind nodes). May be a
# single scalar or a YAML list; entries must be non-empty strings (IP literal
# or hostname). Empty / absent -> advertise only discovered interfaces.
advertise_address:
  # - 192.168.1.5
  # - 10.0.0.3

# Static peer endpoints for a multicast-blind subscriber to dial directly
# (ADR-0002 Channel D seed). Use when this node cannot hear the multicast
# group (cross-subnet, TTL=1, firewalled groups) and must still reach peers.
# Each entry is an "address:port" endpoint, or a bare host address which
# defaults to grpc_port. Absent / empty -> multicast-only discovery.
# peers:
#   - 192.168.1.5:4000
#   - 10.0.0.3

# Cap on how many Endpoint candidates the heartbeat advertises (MTU guard so
# the small heartbeat datagram cannot balloon).
#   - must be a positive integer; values above 64 clamp to 64
#   - non-numeric, 0, or empty -> falls back to 4
max_advertised_endpoints: 4

# ----------------------------------------------------------------------------
# ADR-003 sharded SPSC receive pipeline (best-effort multicast receive path).
# ----------------------------------------------------------------------------

# Socket-draining threads. ADR-003 keeps v1 at 1 (loopback has one kernel RX
# queue; the true parallel lever is worker_threads below). Accepted/validated
# up to 4 but not run >1 yet.
#   - must be an integer in [1, 4]; invalid/out-of-range -> 1
receiver_threads: 1

# Shard / SPSC-ring / registry-shard worker count `N` — the true parallelism
# lever for message RECEPTION. Each worker owns exactly one ring + registry
# shard (no global lock on the hot path). worker_threads=1 reproduces the
# exact single-threaded ordering behavior of the pre-ADR-003 build.
#   - must be an integer in [1, 16]
#   - invalid/out-of-range -> 4
worker_threads: 4

# Slots per worker's bounded userland SPSC ring — the drop buffer that makes
# kernel overruns observable (overflow drops the OLDEST frame, counted, never
# silent).
#   - must be a power of two (mask-based routing)
#   - invalid / non-power-of-two -> 4096
rx_ring_slots: 4096

# SO_RCVBUF on the UDP multicast receive socket, in bytes. 0 = leave the OS
# default (recommended until a value is tuned on the target NIC/host).
#   - must be an integer in [0, 1<<30]
#   - invalid/out-of-range -> 0
so_rcvbuf_bytes: 1048576