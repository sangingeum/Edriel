syntax = "proto3";

// Endpoints shared with the multicast plane (Channel A / ADR-0002) for
// reliable-stream reachability. Compiled in the same package/source dir.
import "autoDiscovery.proto";

package autoDiscovery;

// gRPC service for participant data streaming
// TODO: Implement bidirectional streaming for heartbeat/presence updates

service ParticipantStreamService {
  // Server-side streaming: server pushes participant data
  rpc StreamParticipants (stream ParticipantHeartbeat) 
      returns (stream ParticipantData);
  
  // Unary call for initial connection
  rpc GetParticipantInfo (ParticipantHeartbeat) 
      returns (ParticipantData);
}

message ParticipantHeartbeat {
  // TODO: Add optional timestamp for replay attack prevention
  // TODO: Add encryption flag
  uint32 pid = 1;
  uint64 tid = 2;
  uint64 uid = 3;
  // TODO: Add encryption hash if needed
}

message ParticipantData {
  uint32 pid = 1;
  uint64 tid = 2;
  uint64 uid = 3;
  string endpoint = 4;  // gRPC endpoint address (legacy, kept for back-compat)
  string status = 5;  // online/offline/timedout
  repeated string topics_published = 6;
  repeated string topics_subscribed = 7;
  // Rich unicast endpoints, same shape as the multicast heartbeat carries.
  // ADDITIVE proto3 field (field 8); old peers ignore it. Multiple candidates
  // express multi-homed reachability; try in order, first-wins.
  repeated Endpoint endpoints = 8;
  // Reliable payload frame (ADR-0002): one serialized DataMessage carrying a
  // reliable topic's payload, pushed by the publisher over the subscriber's
  // StreamParticipants stream. Distinct from presence ParticipantData, which
  // leaves this field empty. ADDITIVE proto3 (field 9); old peers ignore it.
  bytes reliable_data = 9;
  // TODO: Add capability flags (supports streaming, etc.)
}
